[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "osx-file-renamer"
version = "2.6.2"
description = "AI-powered invoice and document file renamer using LLM APIs (Claude, GPT, Grok, Gemini, 100+ others)"
authors = [
    {name = "Rob"}
]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: MacOS",
    "Topic :: Utilities",
    "Topic :: Office/Business",
]
keywords = ["invoice", "renamer", "pdf", "ai", "llm", "claude", "gpt", "grok", "gemini", "document-management", "file-organization"]

# Runtime dependencies
dependencies = [
    "titlecase>=2.4.0,<3.0.0",
    "Pillow>=10.0.0,<13.0.0",
    "litellm>=1.0.0,<2.0.0",
]

# Optional dependency groups
[project.optional-dependencies]
heic = [
    "pillow-heif>=0.13.0",
]
dev = [
    "pytest>=9.0.3,<10.0.0",
    "pytest-mock>=3.15.1,<4.0.0",
    "pytest-cov>=7.1.0,<8.0.0",
    "pytest-xdist>=3.8.0,<4.0.0",
    "flake8>=7.3.0,<8.0.0",
    "pre-commit>=3.0.0,<5.0.0",
]
test = [
    "pytest>=9.0.3,<10.0.0",
    "pytest-mock>=3.15.1,<4.0.0",
    "pytest-cov>=7.1.0,<8.0.0",
    "pytest-xdist>=3.8.0,<4.0.0",
]

# Console scripts - creates command-line commands
[project.scripts]
invoice-renamer = "invoice_renamer:main"

# Project URLs
[project.urls]
Homepage = "https://github.com/the-mace/osx-file-renamer"
Issues = "https://github.com/the-mace/osx-file-renamer/issues"
Repository = "https://github.com/the-mace/osx-file-renamer"

# ============================================
# Tool Configurations
# ============================================

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
]
markers = [
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.coverage.run]
source = ["."]
omit = [
    "tests/*",
    "setup.py",
    ".venv/*",
    "venv/*",
    "env/*",
    "*/__pycache__/*",
    ".pytest_cache/*",
]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "def __str__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
precision = 2
show_missing = true

[tool.coverage.html]
directory = "htmlcov"

# Explicitly specify which Python modules to include
# Since we have multiple top-level scripts (llm_client.py, invoice_renamer.py)
[tool.setuptools]
py-modules = ["llm_client", "invoice_renamer"]

# Bandit security linter configuration
[tool.bandit]
exclude_dirs = ["tests", ".venv", "venv", "env"]
skips = [
    "B101",  # assert_used - we use asserts in tests
    "B310",  # urllib_urlopen - we're using it for controlled API calls to known endpoints
    "B404",  # import_subprocess - we need subprocess for calling external tools
    "B603",  # subprocess_without_shell_equals_true - acceptable for controlled input
    "B607",  # start_process_with_partial_path - system tools like convert, pdftotext are in PATH
]
# Severity level: all, low, medium, high
severity = "medium"
